<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — Sopes Auto Detailing</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #04080a;
      color: #f5f5f0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── STARS ─────────────────────────────────────────────── */
    .stars { position: fixed; inset: 0; pointer-events: none; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite var(--delay);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--min-op); transform: scale(1); }
      50%       { opacity: 1; transform: scale(1.5); }
    }

    /* ── NEBULA GLOW ───────────────────────────────────────── */
    .nebula {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 70% 30%, rgba(201,168,76,0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 75%, rgba(26,74,39,0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(4,8,10,0.8) 0%, transparent 80%);
    }

    /* ── PAGE ──────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 48px 28px;
      max-width: 520px;
      width: 100%;
    }

    /* ── BRAND LINE ────────────────────────────────────────── */
    .brand-line {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 0.35em;
      color: rgba(245,245,240,0.22);
      text-transform: uppercase;
      margin-bottom: 52px;
    }

    /* ── ROCKET CONTAINER ──────────────────────────────────── */
    .rocket-scene {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 56px;
      animation: float 3.6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-20px); }
    }

    /* Orbit ring */
    .orbit-ring {
      position: absolute;
      inset: -55px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.12);
      animation: spin 14s linear infinite;
      pointer-events: none;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .orbit-dot {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: #c9a84c;
      border-radius: 50%;
      box-shadow: 0 0 14px 4px rgba(201,168,76,0.7);
    }

    /* Rocket SVG */
    .rocket-svg {
      width: 110px;
      height: auto;
      filter: drop-shadow(0 4px 32px rgba(201,168,76,0.35));
    }

    /* Flame wrapper */
    .flame-wrap {
      position: relative;
      width: 36px;
      margin-top: -4px;
      height: 60px;
    }
    .flame-core {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 46px;
      background: linear-gradient(to bottom,
        #ffffff 0%,
        #ffe566 18%,
        #ffa500 45%,
        #ff4500 72%,
        transparent 100%
      );
      border-radius: 50% 50% 40% 40%;
      animation: flicker-core 0.12s ease-in-out infinite alternate;
      transform-origin: top center;
      filter: blur(1px);
    }
    .flame-outer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 36px;
      background: linear-gradient(to bottom,
        rgba(255,165,0,0.6) 0%,
        rgba(255,69,0,0.4) 50%,
        transparent 100%
      );
      border-radius: 50% 50% 40% 40%;
      animation: flicker-outer 0.18s ease-in-out infinite alternate;
      transform-origin: top center;
      filter: blur(3px);
    }
    @keyframes flicker-core {
      0%   { transform: translateX(-50%) scaleX(0.88) scaleY(1.04); }
      33%  { transform: translateX(-50%) scaleX(1.08) scaleY(0.94); }
      66%  { transform: translateX(-50%) scaleX(0.92) scaleY(1.06); }
      100% { transform: translateX(-50%) scaleX(1.05) scaleY(0.96); }
    }
    @keyframes flicker-outer {
      0%   { transform: translateX(-50%) scaleX(0.9) scaleY(1.1) rotate(-2deg); opacity: 0.85; }
      50%  { transform: translateX(-50%) scaleX(1.15) scaleY(0.88) rotate(1deg); opacity: 1; }
      100% { transform: translateX(-50%) scaleX(0.85) scaleY(1.05) rotate(-1deg); opacity: 0.9; }
    }

    /* Exhaust trail */
    .exhaust {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      border-radius: 0 0 2px 2px;
      background: linear-gradient(to bottom, rgba(255,100,0,0.5), transparent);
      animation: exhaust-anim 0.3s ease-in-out infinite alternate;
    }
    @keyframes exhaust-anim {
      0%   { height: 28px; opacity: 0.6; }
      100% { height: 48px; opacity: 0.3; }
    }

    /* Particles */
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffa500;
      animation: particle-fall var(--p-dur) ease-out infinite var(--p-delay);
      opacity: 0;
    }
    @keyframes particle-fall {
      0%   { opacity: 0.8; transform: translate(var(--px), 0) scale(1); }
      100% { opacity: 0;   transform: translate(calc(var(--px) * 1.8), 60px) scale(0.3); }
    }

    /* ── BADGE ─────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(201,168,76,0.09);
      border: 1px solid rgba(201,168,76,0.28);
      padding: 6px 18px;
      border-radius: 100px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background: #c9a84c;
      border-radius: 50%;
      animation: badge-pulse 2s ease-in-out infinite;
    }
    @keyframes badge-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(201,168,76,0.5); }
      50%       { opacity: 0.5; box-shadow: 0 0 0 5px rgba(201,168,76,0); }
    }

    /* ── HEADLINE ──────────────────────────────────────────── */
    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(58px, 13vw, 104px);
      letter-spacing: 0.04em;
      line-height: 0.92;
      color: #f5f5f0;
      margin-bottom: 24px;
    }
    .headline .gold { color: #c9a84c; }

    /* ── SUBTEXT ───────────────────────────────────────────── */
    .sub {
      font-size: clamp(15px, 2.2vw, 18px);
      color: rgba(245,245,240,0.58);
      line-height: 1.65;
      margin-bottom: 10px;
    }
    .sub strong {
      color: rgba(245,245,240,0.85);
      font-weight: 600;
    }

    /* ── DIVIDER ───────────────────────────────────────────── */
    .divider {
      width: 48px;
      height: 1px;
      background: rgba(201,168,76,0.3);
      margin: 32px auto;
    }

    /* ── CONTACT ───────────────────────────────────────────── */
    .contact-line {
      font-size: 13px;
      color: rgba(245,245,240,0.35);
      letter-spacing: 0.05em;
    }
    .contact-line a {
      color: #c9a84c;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .contact-line a:hover { opacity: 0.75; }

    /* ── CREDIT ────────────────────────────────────────────── */
    .credit {
      margin-top: 48px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(245,245,240,0.2);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="nebula"></div>

<div class="page">

  <div class="brand-line">Sopes Auto Detailing</div>

  <!-- Rocket scene -->
  <div class="rocket-scene" id="rocketScene">
    <div class="orbit-ring"><div class="orbit-dot"></div></div>

    <svg class="rocket-svg" viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Nose cone -->
      <path d="M50 8 C36 26 28 52 28 68 H72 C72 52 64 26 50 8Z" fill="#e4c265"/>
      <!-- Body -->
      <rect x="28" y="66" width="44" height="52" rx="4" fill="#c9a84c"/>
      <!-- Body shadow -->
      <rect x="28" y="66" width="18" height="52" rx="4" fill="rgba(0,0,0,0.12)"/>
      <!-- Window ring -->
      <circle cx="50" cy="88" r="13" fill="rgba(0,0,0,0.35)" stroke="#e4c265" stroke-width="2.5"/>
      <!-- Window glass -->
      <circle cx="50" cy="88" r="9" fill="#0b1f2a"/>
      <!-- Window highlight -->
      <circle cx="46" cy="84" r="3" fill="rgba(255,255,255,0.18)"/>
      <!-- Window glow -->
      <circle cx="50" cy="88" r="9" fill="url(#windowGlow)" opacity="0.6"/>
      <!-- Left fin -->
      <path d="M28 102 L10 138 L28 124Z" fill="#a8883c"/>
      <!-- Right fin -->
      <path d="M72 102 L90 138 L72 124Z" fill="#a8883c"/>
      <!-- Nozzle -->
      <rect x="38" y="116" width="24" height="10" rx="2" fill="#8a6f2c"/>
      <!-- Body detail stripes -->
      <rect x="28" y="96" width="44" height="2" rx="1" fill="rgba(255,255,255,0.08)"/>
      <rect x="28" y="108" width="44" height="2" rx="1" fill="rgba(255,255,255,0.08)"/>
      <!-- Nose tip highlight -->
      <path d="M50 8 C47 15 43 24 42 34 C44 30 48 20 50 8Z" fill="rgba(255,255,255,0.2)"/>

      <defs>
        <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a6b9a"/>
          <stop offset="100%" stop-color="#0b1f2a"/>
        </radialGradient>
      </defs>
    </svg>

    <!-- Flame -->
    <div class="flame-wrap">
      <div class="flame-outer"></div>
      <div class="flame-core"></div>
      <div class="exhaust"></div>
    </div>

    <!-- Exhaust particles injected by JS -->
  </div>

  <div class="badge">
    <div class="badge-dot"></div>
    Under Construction
  </div>

  <h1 class="headline">
    We're<br><span class="gold">Launching</span><br>Something New
  </h1>

  <p class="sub">
    <strong>Visualize Studio</strong> is working on the website.<br>
    We'll be back up and running shortly.
  </p>

  <div class="divider"></div>

  <p class="contact-line">
    Questions? Call us at <a href="tel:4849990194">(484) 999-0194</a>
  </p>

  <div class="credit">Built by Visualize Studio</div>

</div>

<script>
  /* Stars */
  (function () {
    var container = document.getElementById('stars');
    for (var i = 0; i < 160; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      var size = Math.random() * 2.4 + 0.4;
      s.style.cssText =
        'width:' + size + 'px;' +
        'height:' + size + 'px;' +
        'left:' + (Math.random() * 100) + '%;' +
        'top:' + (Math.random() * 100) + '%;' +
        '--dur:' + (Math.random() * 3 + 2) + 's;' +
        '--delay:-' + (Math.random() * 6) + 's;' +
        '--min-op:' + (Math.random() * 0.25 + 0.05);
      container.appendChild(s);
    }
  })();

  /* Exhaust particles */
  (function () {
    var scene = document.getElementById('rocketScene');
    var flameWrap = scene.querySelector('.flame-wrap');
    for (var i = 0; i < 8; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var xOffset = (Math.random() - 0.5) * 22;
      p.style.cssText =
        '--px:' + xOffset + 'px;' +
        '--p-dur:' + (Math.random() * 0.6 + 0.4) + 's;' +
        '--p-delay:-' + (Math.random() * 1) + 's;' +
        'bottom:-8px;' +
        'left:calc(50% + ' + xOffset * 0.3 + 'px);';
      flameWrap.appendChild(p);
    }
  })();
</script>
</body>
</html>
